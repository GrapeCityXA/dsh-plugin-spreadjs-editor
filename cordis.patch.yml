# dsh-spreadjs-editor bundle patch
#
# One row activates the whole plugin: the Loader imports the package's node
# half (lib/index.js, the /spreadjs license/config endpoint) and the
# client-modules scan picks up the `dsh.client` declaration for the browser
# half (lib/client.js, which registers the SpreadJS viewer into
# dsh-better-sidebar).
#
# The row must run only under the Web composition (it injects the webServer
# service); a headless profile should not mount this bundle. The browser half
# has no hard client dependency: it waits for `dsh-better-sidebar`, which is
# bundled by @linxin666/dsh-web-all (ui-all).

- insert:
    - id: spreadjs-editor
      name: @grapecity-software/dsh-spreadjs-editor
      inject: [webServer]
      config:
        # Optional: your SpreadJS license key. Empty (default) runs the
        # evaluation watermark build. Keep it out of the patch if you prefer
        # to configure it per-deployment.
        licenseKey: ''
