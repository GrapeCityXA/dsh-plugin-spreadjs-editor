# dsh-spreadjs-editor bundle patch
#
# One row activates the whole plugin: the Loader imports the package's node
# half (lib/index.js, the /spreadjs file bridge) and the client-modules scan
# picks up the `dsh.client` declaration for the browser half (lib/client.js,
# which registers the SpreadJS editor into webFileEditors).
#
# The row must run only under the Web composition (it injects the webServer
# service); a headless profile should not mount this bundle. The generic
# dsh-plugin-web-editors row must be mounted in the same Web profile so the
# client service is available when this browser half activates.

- insert:
    - id: spreadjs-editor
      name: dsh-spreadjs-editor
      inject: [webServer]
      config:
        # Optional: directory scanned when a file request has no explicit root.
        # Defaults to the harness process working directory.
        defaultRoot: !!js process.cwd()
        # Optional: your SpreadJS license key. Empty (default) runs the
        # evaluation watermark build. Keep it out of the patch if you prefer
        # to configure it per-deployment.
        licenseKey: ''
